name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # CometInk is a Windows-only desktop app; Windows path semantics matter here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow cryptography
      - name: Run unit tests
        run: python tests/run_tests.py
