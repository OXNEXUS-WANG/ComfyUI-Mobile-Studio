<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>需要登录 · 手机出图</title>
<style>
  :root {
    --bg0:#0a0d16; --bg1:#121827; --ink:#e9eefb; --dim:#93a0bb;
    --line:rgba(255,255,255,.10); --glass:rgba(255,255,255,.055);
    --accent:#7aa2ff; --danger:#ff7b8a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body {
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(1200px 700px at 15% -10%, #1d2a4d 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #2a1f45 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg0));
  }
  .card {
    width:100%; max-width:360px; padding:30px 24px 24px; border-radius:22px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  h1 { margin:0 0 6px; font-size:19px; letter-spacing:.3px; }
  p.sub { margin:0 0 22px; color:var(--dim); font-size:13px; line-height:1.6; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:7px; }
  input {
    width:100%; padding:14px 15px; font-size:16px; color:var(--ink);
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px;
    outline:none; transition:border-color .18s, box-shadow .18s;
  }
  input:focus { border-color:rgba(122,162,255,.65); box-shadow:0 0 0 3px rgba(122,162,255,.15); }
  button {
    width:100%; margin-top:16px; padding:14px; font-size:15px; font-weight:600;
    color:#0a0f1d; border:0; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#9dbcff,#7aa2ff);
    transition:transform .12s, filter .18s;
  }
  button:active { transform:scale(.985); }
  button:disabled { filter:grayscale(.5) brightness(.8); cursor:default; }
  .msg { min-height:20px; margin-top:14px; font-size:13px; color:var(--danger); }
  .hint { margin-top:20px; font-size:11.5px; color:#66708a; line-height:1.7; }
  .lang {
    position:fixed; right:16px; top:16px; z-index:5;
    width:auto; margin:0; padding:7px 12px; border-radius:999px;
    border:1px solid var(--line); background:var(--glass);
    color:var(--dim); font:600 12px system-ui,sans-serif;
    cursor:pointer; backdrop-filter:blur(12px);
  }
  .lang:hover { color:var(--ink); border-color:rgba(122,162,255,.55); }
</style>
<script src="/i18n.js?v=20261022a"></script>
</head>
<body>
<button class="lang" type="button" data-lang-toggle>EN</button>
<form class="card" id="f" autocomplete="off">
  <h1>手机出图</h1>
  <p class="sub">输入账号和密码后进入。<br>管理员和普通账号看到的图库、配额是分开的。</p>
  <label for="un">账号</label>
  <input id="un" type="text" inputmode="text" autocomplete="username"
         placeholder="输入账号" value="admin" required>
  <label for="pw" style="margin-top:14px">密码</label>
  <input id="pw" type="password" inputmode="text" autocomplete="current-password"
         placeholder="输入密码" required>
  <button id="go" type="submit">进入</button>
  <div class="msg" id="msg"></div>
  <div class="hint">账号由管理员在「3D 星图 → 安全网关 → 用户管理」里创建。<br>连续输错 5 次会锁定 10 分钟。</div>
</form>
<script>
(function () {
  var f = document.getElementById("f");
  var un = document.getElementById("un");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  pw.focus();
  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    var name = (un.value || "").trim();
    var v = pw.value;
    if (!name || !v) { return; }
    go.disabled = true;
    msg.textContent = "";
    try {
      var r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: name, password: v })
      });
      var j = await r.json().catch(function () { return {}; });
      if (r.ok && j.ok) {
        msg.style.color = "#7ee0a8";
        msg.textContent = "登录成功，正在进入…";
        try {
          if (j.default_home) localStorage.setItem("mg_default_home", j.default_home);
        } catch (err) {}
        location.replace(j.redirect || "/");
        return;
      }
      msg.style.color = "#ff7b8a";
      msg.textContent = j.error || "用户名或密码不对";
      pw.select();
    } catch (err) {
      msg.style.color = "#ff7b8a";
      msg.textContent = "连不上服务：" + err.message;
    }
    go.disabled = false;
  });
})();
</script>
</body>
</html>
